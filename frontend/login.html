<!DOCTYPE html>
<html class="dark" lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>IT seobiseu - Autenticación y Acceso Seguro</title>
  
  <!-- Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              main: '#0B132B',
              surface: '#1C2541',
              card: '#1E293B',
              cyan: '#38BDF8',
              electric: '#48CAE4',
              cobalt: '#0077B6',
            }
          },
          fontFamily: {
            display: ['"Plus Jakarta Sans"', 'sans-serif'],
            sans: ['Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="./styles/custom.css">
</head>

<body class="bg-grid-pattern text-slate-100 font-sans min-h-screen flex items-center justify-center p-4 relative antialiased selection:bg-brand-cyan selection:text-slate-900 overflow-hidden">

  <!-- Ambient Glows -->
  <div class="absolute -top-40 -left-20 w-96 h-96 rounded-full bg-brand-cyan/10 blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-32 -right-20 w-96 h-96 rounded-full bg-brand-cobalt/15 blur-3xl pointer-events-none"></div>
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] rounded-full bg-sky-500/5 blur-[120px] pointer-events-none"></div>

  <div class="relative w-full max-w-sm mx-auto z-10">
    
    <!-- System Status Badge -->
    <div class="flex items-center justify-between mb-3 px-1">
      <div class="flex items-center gap-1.5">
        <span class="inline-flex h-2 w-2 rounded-full bg-emerald-400 animate-ping"></span>
        <span class="font-mono text-[10px] text-slate-400 uppercase tracking-wider">SISTEMA EN LÍNEA • 99.98%</span>
      </div>
      <div class="flex items-center gap-1 font-mono text-[10px] text-brand-cyan bg-[#1C2541] border border-slate-800 px-2 py-0.5 rounded-full">
        <span class="material-symbols-outlined text-xs">terminal</span>
        <span>v2.5-PROD</span>
      </div>
    </div>

    <!-- Login Glassmorphic Card -->
    <div class="bg-[#1C2541]/90 backdrop-blur-2xl border border-slate-800 shadow-2xl rounded-2xl p-6 sm:p-7 relative overflow-hidden">
      <div class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-sky-400 to-transparent opacity-70"></div>
      
      <!-- Brand Logo in Form -->
      <div class="flex flex-col items-center text-center mb-6">
        <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-[#0077B6] to-[#48CAE4] p-[1.5px] shadow-lg shadow-sky-500/25 mb-2.5">
          <div class="w-full h-full bg-[#0B132B] rounded-[10px] flex items-center justify-center">
            <span class="material-symbols-outlined text-brand-electric text-[22px]" style="font-variation-settings: 'FILL' 1;">terminal</span>
          </div>
        </div>
        <h1 class="font-display font-bold text-lg text-white tracking-tight">IT seobiseu</h1>
        <span class="text-[10px] font-mono text-brand-cyan uppercase tracking-widest mt-0.5">Soporte y continuidad operativa</span>
      </div>

      <!-- Form con validación dinámica y spinner en botón -->
            <!-- Selector de Roles Demo -->
      <div class="mb-5 p-3 rounded-xl bg-[#0B132B]/70 border border-slate-800">
        <div class="flex items-center justify-between mb-2">
          <span class="text-[10px] font-mono text-brand-cyan uppercase tracking-wider font-semibold">Roles Demo para Pruebas:</span>
          <span class="text-[9px] font-mono text-slate-500">Click para autocompletar</span>
        </div>
        <div class="grid grid-cols-2 gap-1.5">
          <button type="button" data-role-demo="admin" class="btn-role-demo text-left px-2 py-1.5 rounded-lg bg-slate-800/80 hover:bg-sky-500/20 border border-slate-700/60 hover:border-brand-cyan/60 transition-all group">
            <div class="text-[11px] font-semibold text-slate-200 group-hover:text-brand-cyan flex items-center gap-1.5">
              <span class="material-symbols-outlined text-[14px] text-brand-cyan">admin_panel_settings</span> <span>Admin</span>
            </div>
            <div class="text-[9px] font-mono text-slate-400 truncate">admin@it-seobiseu.local</div>
          </button>
          <button type="button" data-role-demo="supervisor" class="btn-role-demo text-left px-2 py-1.5 rounded-lg bg-slate-800/80 hover:bg-sky-500/20 border border-slate-700/60 hover:border-brand-cyan/60 transition-all group">
            <div class="text-[11px] font-semibold text-slate-200 group-hover:text-brand-cyan flex items-center gap-1.5">
              <span class="material-symbols-outlined text-[14px] text-amber-400">shield</span> <span>Supervisor</span>
            </div>
            <div class="text-[9px] font-mono text-slate-400 truncate">supervisor@it-seobiseu.local</div>
          </button>
          <button type="button" data-role-demo="tecnico" class="btn-role-demo text-left px-2 py-1.5 rounded-lg bg-slate-800/80 hover:bg-sky-500/20 border border-slate-700/60 hover:border-brand-cyan/60 transition-all group">
            <div class="text-[11px] font-semibold text-slate-200 group-hover:text-brand-cyan flex items-center gap-1.5">
              <span class="material-symbols-outlined text-[14px] text-emerald-400">build</span> <span>Técnico</span>
            </div>
            <div class="text-[9px] font-mono text-slate-400 truncate">tecnico@it-seobiseu.local</div>
          </button>
          <button type="button" data-role-demo="cliente" class="btn-role-demo text-left px-2 py-1.5 rounded-lg bg-slate-800/80 hover:bg-sky-500/20 border border-slate-700/60 hover:border-brand-cyan/60 transition-all group">
            <div class="text-[11px] font-semibold text-slate-200 group-hover:text-brand-cyan flex items-center gap-1.5">
              <span class="material-symbols-outlined text-[14px] text-purple-400">person</span> <span>Cliente VIP</span>
            </div>
            <div class="text-[9px] font-mono text-slate-400 truncate">cliente@it-seobiseu.local</div>
          </button>
        </div>
      </div>
      <form data-auth-form class="space-y-3.5">
        <div>
          <label class="block text-[10px] font-mono text-slate-400 mb-1 uppercase font-semibold">Correo Corporativo *</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-[16px]">badge</span>
            <input 
              required
              class="w-full bg-[#0B132B]/90 font-sans text-xs text-slate-200 placeholder:text-slate-500 rounded-xl pl-9 pr-3.5 py-2.5 border border-slate-800 focus:border-brand-cyan/60 focus:bg-[#0B132B] focus:outline-none transition-all" 
              placeholder="carlos.mendoza@seobiseu.it" 
              type="email"
              name="email"
            />
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="block text-[10px] font-mono text-slate-400 uppercase font-semibold">Contraseña *</label>
            <a href="#" class="text-[10px] text-brand-cyan hover:underline font-mono">¿Olvidó clave?</a>
          </div>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-[16px]">lock</span>
            <input 
              required
              class="w-full bg-[#0B132B]/90 font-sans text-xs text-slate-200 placeholder:text-slate-500 rounded-xl pl-9 pr-3.5 py-2.5 border border-slate-800 focus:border-brand-cyan/60 focus:bg-[#0B132B] focus:outline-none transition-all" 
              placeholder="••••••••••••" 
              type="password"
              name="password"
            />
          </div>
        </div>

        <div class="flex items-center justify-between pt-0.5">
          <label class="flex items-center gap-1.5 cursor-pointer text-[11px] text-slate-400 select-none">
            <input type="checkbox" checked class="rounded bg-slate-800 border-slate-700 text-brand-cyan focus:ring-0"/>
            <span>Recordar terminal</span>
          </label>
          <span class="text-[10px] font-mono text-slate-500">2FA Activo</span>
        </div>

        <button 
          type="submit" 
          class="btn-primary-gradient w-full mt-2 py-2.5 rounded-xl font-display text-xs font-bold shadow-lg shadow-sky-500/25 transition-all flex items-center justify-center gap-1.5"
        >
          <span class="material-symbols-outlined text-[16px]">login</span>
          <span>Iniciar Sesión en el Sistema</span>
        </button>
      </form>

      <div class="mt-4 pt-3 border-t border-slate-800/80 text-center text-[10px] font-mono text-slate-500">
        IT seobiseu OS • TLS 1.3 Enterprise
      </div>

    </div>

  </div>

  <script src="./config.js"></script>
  <script type="module" src="./js/app.js"></script>
  <script type="module" src="./js/login.js"></script>
</body>
</html>
